<!doctype html>
<html lang="en">
<head>

<body>
<template id="dc-template">
<helmet>
<style>
body{margin:0;background:#07080D}
*{box-sizing:border-box}
a{color:#B8ACFF}a:hover{color:#D6CFFF}
button,input{font:inherit}
input::placeholder{color:#7E849B}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid #A497FF;outline-offset:2px}
.tk-row:hover{background:#141723}
@keyframes tk-pulse{0%,100%{box-shadow:0 0 0 0 rgba(54,214,140,.55)}50%{box-shadow:0 0 0 5px rgba(54,214,140,0)}}
@keyframes tk-in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="min-height: 100vh; background: #07080D; color: #F3F4FA; font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 14px; display: flex; flex-wrap: wrap; align-items: stretch; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: -60px; top: -320px; width: 1100px; height: 760px; background: radial-gradient(closest-side, rgba(123,102,255,0.28), rgba(123,102,255,0)); pointer-events: none"></div>
  <div aria-hidden="true" style="position: absolute; left: 520px; top: -260px; width: 700px; height: 520px; background: radial-gradient(closest-side, rgba(255,157,201,0.07), rgba(255,157,201,0)); pointer-events: none"></div>

  <nav aria-label="Main" style="flex: 1 1 76px; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 8px; background: #05060A; border-right: 1px solid #1B1F2D; position: relative; z-index: 2">
    <a href="explore.html" aria-label="Tonkpad.fun home" style="display: flex; text-decoration: none">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true"><defs><linearGradient id="tkTokLogo" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#B9AEFF"/><stop offset="1" stop-color="#5B47F0"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#tkTokLogo)"/><ellipse cx="20" cy="21" rx="14" ry="6.5" transform="rotate(-24 20 21)" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.6"/><path d="M12.5 13.5H27.5M20 13.5V29" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/><circle cx="32.9" cy="17.7" r="2.2" fill="#FFFFFF"/></svg>
    </a>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%">
      <a href="explore.html" aria-current="page" style="width: 60px; height: 58px; border-radius: 14px; background: rgba(140,123,255,0.14); color: #B8ACFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none">

        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: #F3F4FA">Explore</span>
      </a>
      <button type="button" style="width: 60px; height: 58px; border-radius: 14px; background: transparent; border: 0; color: #A2A7BE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></svg>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: #7E849B">Live</span>
      </button>
      <a href="#later" data-later="Bridge" style="width: 60px; height: 58px; border-radius: 14px; color: #A2A7BE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: #7E849B">Bridge</span>
      </a>
      <a href="#later" data-later="Portfolio" style="width: 60px; height: 58px; border-radius: 14px; color: #A2A7BE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: #7E849B">Portfolio</span>
      </a>
      <button type="button" aria-label="Alerts, 3 new" style="position: relative; width: 60px; height: 58px; border-radius: 14px; background: transparent; border: 0; color: #A2A7BE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: #7E849B">Alerts</span>
        <span style="position: absolute; left: 34px; top: 5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #FF5C74; color: #1A0509; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center">3</span>
      </button>
      <a href="#later" data-later="Launch (Creator Studio)" style="width: 60px; height: 58px; border-radius: 14px; color: #A2A7BE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: #7E849B">Launch</span>
      </a>
      <button type="button" style="width: 60px; height: 58px; border-radius: 14px; background: transparent; border: 0; color: #A2A7BE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: #7E849B">Docs</span>
      </button>
    </div>
    <div style="flex: 1 1 auto"></div>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%">
      <button type="button" style="width: 60px; height: 58px; border-radius: 14px; background: transparent; border: 0; color: #A2A7BE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: #7E849B">Theme</span>
      </button>
      <button type="button" style="width: 60px; height: 58px; border-radius: 14px; background: transparent; border: 0; color: #A2A7BE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: #7E849B">More</span>
      </button>
    </div>
  </nav>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; position: relative; z-index: 1">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px clamp(16px, 2vw, 24px); border-bottom: 1px solid #1B1F2D; background: rgba(7,8,13,0.86); position: relative; z-index: 5">
      <label for="tk-search-t" style="flex: 1 1 240px; max-width: 340px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border-radius: 12px; background: #0D0F17; border: 1px solid #1B1F2D; color: #7E849B">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search tokens</span>
        <input id="tk-search-t" type="search" placeholder="Search token, ticker or CA" style="flex: 1 1 auto; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0; color: #F3F4FA; font-size: 13px">
        <kbd style="padding: 1px 7px; border-radius: 6px; background: #141723; border: 1px solid #2A2F42; color: #A2A7BE; font: 400 12px 'Geist Mono', ui-monospace, monospace">/</kbd>
      </label>
      <div aria-label="Live ticker" style="flex: 999 1 260px; min-width: 0; height: 40px; overflow: hidden; display: flex; align-items: center; gap: 22px; padding: 0 8px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 28px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, transparent, #000 28px, #000 calc(100% - 28px), transparent)">
        <sc-for list="{{ tape }}" as="k" hint-placeholder-count="8">
          <span style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: 0 0 auto">
            <img src="{{ k.art }}" alt="" style="width: 20px; height: 20px; border-radius: 6px">
            <span style="font-size: 12px; font-weight: 600">{{ k.tick }}</span>
            <span style="font: 400 12px 'Geist Mono', ui-monospace, monospace; color: #A2A7BE">{{ k.mcap }}</span>
            <span style="font: 500 12px 'Geist Mono', ui-monospace, monospace; color: {{ k.chgColor }}">{{ k.chg }}</span>
          </span>
        </sc-for>
      </div>
      <button type="button" aria-haspopup="listbox" aria-expanded="false" style="height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px 0 8px; border-radius: 12px; background: #0D0F17; border: 1px solid #2A2F42; color: #F3F4FA; cursor: pointer">
        <span style="display: inline-flex">
          <span title="Solana" style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #0D0F17; background: linear-gradient(135deg, #9945FF, #19FB9B); display: inline-flex; align-items: center; justify-content: center; color: #0B0A1A; font-size: 9px; font-weight: 700">S</span>
          <span title="Robinhood Chain" style="width: 20px; height: 20px; margin-left: -6px; border-radius: 50%; border: 2px solid #0D0F17; background: #CCFF00; display: inline-flex; align-items: center; justify-content: center; color: #0E1400; font-size: 9px; font-weight: 700">R</span>
        </span>
        <span style="font-size: 13px; font-weight: 600; white-space: nowrap">All Chains</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #A2A7BE"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button type="button" aria-label="Alerts" style="position: relative; width: 40px; height: 40px; border-radius: 12px; background: #0D0F17; border: 1px solid #1B1F2D; color: #A2A7BE; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span style="position: absolute; right: 9px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: #8C7BFF; box-shadow: 0 0 0 2px #0D0F17"></span>
      </button>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; background: #141723; color: #F3F4FA; border: 1px solid #2A2F42; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap">
        <span style="width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #FF9A4D, #E2445E)"></span>
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500">0xb4e2…19ac</span>
      </button>
    </header>

    <main style="flex: 1 1 auto; width: 100%; max-width: 1364px; padding: 20px clamp(16px, 3vw, 40px) 56px; display: flex; flex-direction: column; gap: 16px">
      <nav aria-label="Breadcrumb" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: #7E849B">
        <a href="explore.html" style="display: inline-flex; align-items: center; gap: 6px; color: #7E849B; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Explore</a>
        <span>/</span><span>Trending</span><span>/</span><span style="color: #F3F4FA; font-weight: 600">Ghosty</span>
      </nav>

      <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
        <div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

          <section aria-label="Token" style="position: relative; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 28px; border-radius: 24px; background: radial-gradient(42% 110% at 10% 30%, rgba(123,102,255,0.42), rgba(123,102,255,0)), radial-gradient(35% 80% at 42% 0%, rgba(255,157,201,0.1), rgba(255,157,201,0)), #0D0F17; border: 1px solid #1B1F2D; box-shadow: 0 24px 48px -24px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05); overflow: hidden">

              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
                <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Geist, sans-serif; font-weight: 800; font-size: 40px; line-height: 44px; letter-spacing: -0.02em">Ghosty</h1>
                <span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px; border-radius: 999px; background: #141723; border: 1px solid #2A2F42; font-size: 12px; font-weight: 500; color: #F3F4FA">
                  <span style="width: 18px; height: 18px; border-radius: 50%; background: #CCFF00; display: inline-flex; align-items: center; justify-content: center; color: #0E1400; font-size: 9px; font-weight: 700">R</span>Robinhood Chain
                </span>
                <span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px; border-radius: 8px; background: #141723; border: 1px solid #2A2F42; font-size: 12px; font-weight: 500; color: #A2A7BE">
                  <span style="width: 18px; height: 18px; border-radius: 5px; background: #8C7BFF; display: inline-flex; align-items: center; justify-content: center; color: #0B0A1A; font-size: 10px; font-weight: 700">T</span>Tonkpad Native
                </span>
              </div>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: #7E849B">
                <span style="font: 500 14px 'Geist Mono', ui-monospace, monospace; color: #A2A7BE">$GHOST</span>
                <span>· by</span>
                <span style="width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, #FF9A4D, #E2445E)"></span>
                <span style="font-family: 'Geist Mono', ui-monospace, monospace; color: #A2A7BE">0x7a3c…9f2e</span>
                <span>· launched Oct 18 (18d ago)</span>
              </div>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
                <span style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 7px; border-radius: 8px; background: rgba(20,208,143,0.14); border: 1px solid rgba(20,208,143,0.4); color: #2EE0A1; font-size: 12px; font-weight: 600">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Locked Mission
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="verified" role="img"><path d="M20 6 9 17l-5-5"/></svg>
                </span>
                <span style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 7px; border-radius: 8px; background: rgba(140,123,255,0.16); border: 1px solid rgba(244,197,83,0.4); color: #F4C553; font-size: 12px; font-weight: 600">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>Crew Rewards 2%
                </span>
                <span style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 7px; border-radius: 8px; background: rgba(90,169,255,0.14); border: 1px solid rgba(90,169,255,0.4); color: #8CC4FF; font-size: 12px; font-weight: 600">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg>Agent live
                </span>
                <span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px 4px 7px; border-radius: 8px; background: rgba(54,214,140,0.12); color: #36D68C; font: 600 12px 'Geist Mono', ui-monospace, monospace">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>Mission score 94
                </span>
              </div>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                <button type="button" aria-label="Copy contract address 0x5e1d…a0f3" style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 10px; background: #141723; border: 1px solid #1B1F2D; color: #F3F4FA; cursor: pointer">
                  <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #7E849B">CA</span>
                  <span style="font: 400 12px 'Geist Mono', ui-monospace, monospace">0x5e1d…a0f3</span>

      payLabel: isBuy ? 'You pay' : 'You sell', balText: isBuy ? (+bal.toFixed(4)) + ' ETH on Robinhood Chain' : '3.13M GHOST', balColor: isBuy && bal === 0 ? RD : '#7E849B',
      amount: st.amount, onAmount: (e) => this.setState({ amount: e.target.value }), payUnit: isBuy ? 'ETH' : 'M GHOST', getUnit: isBuy ? 'GHOST' : 'ETH',
      payUsd: isBuy ? '≈ $' + (amt * 3412).toFixed(2) : '≈ $' + (amt * 1e6 * 0.0000582).toFixed(2), presets, receive,
      minText: isBuy ? 'Min. ' + fmtTok(amt * 3412 / 0.0000582 * 0.85) + ' at 15% slippage' : 'Min. ' + (amt * 1e6 * 0.0000582 / 3412 * 0.85).toFixed(4) + ' ETH',
      canTrade: enough, cantTrade: !enough, ctaBg: isBuy ? G : RD, ctaFg: isBuy ? '#03150C' : '#1A0509', ctaLabel: isBuy ? 'Buy $GHOST · ' + st.amount + ' ETH' : 'Sell ' + st.amount + 'M $GHOST',
      cantLabel: amt <= 0 ? 'Enter an amount' : isBuy ? 'Not enough ETH on Robinhood Chain' : 'Not enough $GHOST',
      bridgeOpen: st.bridgeOpen, bChains, bSend: bc[4], bProvider: bc[5], bRoute: bc[6] + ' · auto-selected', bEta: bc[7],
      doBridge: () => this.setState({ bridgeOpen: false, bal: +(this.state.bal + 0.25).toFixed(4), toast: true }),
      msgs, asks, chatRef: this.chatRef, draft: st.draft, onDraft: (e) => this.setState({ draft: e.target.value }),
      send: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const text = (this.state.draft || '').trim();
        if (!text) return;
        const low = text.toLowerCase();
        const key = /lock|vest|dev|unlock/.test(low) ? 'lock' : /crew|reward|earn|fee|paid/.test(low) ? 'crew' : /brief|mission|status|summary/.test(low) ? 'brief' : 'other';
        this.ask(text, key);
      }
    };
  }
}
</script>
<script>TonkpadDC.boot();</script>
